# MOVER ESTE ARCHIVO A .github/workflows/ci.yml (Claude no puede escribir en la carpeta .github)
# Revisión automática: en cada push o pull request compila el backend, corre las
# pruebas JUnit y revisa la app móvil (análisis + pruebas + APK de depuración).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: synergy-apk-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
