# =====================================================================
#  PERFIL DE PRODUCCIÓN
#  Se activa con:  java -jar synergy.jar --spring.profiles.active=prod
#  (o la variable de entorno SPRING_PROFILES_ACTIVE=prod, como en docker-compose.yml)
#  Todo lo que no esté aquí se toma de application.properties.
# =====================================================================

# Sin datos de prueba: no se crean cuentas demo ni miles de registros generados
synergy.demo.enabled=false
synergy.demo.reset-passwords=false
synergy.datos.generar=false
synergy.datos.historial-riesgo=0
synergy.datos.reemplazar-esquema-antiguo=false
synergy.datos.regenerar-todo=false

# Claves OBLIGATORIAS por variable de entorno (sin valor por defecto: si falta, no arranca)
app.jwtSecret=${JWT_SECRET}

# Cookies solo por HTTPS
server.servlet.session.cookie.secure=true

# Plantillas en caché (más rápido) y CSS/JS/imágenes en caché del navegador 7 días
spring.thymeleaf.cache=true
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# Detrás de un proxy (Render, Railway, Nginx): respetar X-Forwarded-Proto / Host
server.forward-headers-strategy=framework

# Logs más cortos
logging.level.root=WARN
logging.level.com.proaula.spring.synergy=INFO
