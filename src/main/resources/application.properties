spring.application.name=synergy

# ============================================================
# MONGODB CONFIGURATION
# ============================================================
spring.data.mongodb.uri=mongodb://localhost:27017/synergy
spring.data.mongodb.database=synergy

# ============================================================
# SERVER CONFIGURATION
# ============================================================
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# SSL CONFIGURATION 
server.ssl.enabled=false

# ============================================================
# THYMELEAF CONFIGURATION
# ============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================================
# JWT CONFIGURATION
# ============================================================
app.jwtSecret=synergy_secret_key_2024_a_very_long_secret_key_for_jwt_encryption_production_must_be_very_long
app.jwtExpirationMs=900000
app.jwtRefreshExpirationMs=604800000
app.jwtCookieName=SYNERGY_ACCESS_TOKEN
app.jwtRefreshCookieName=SYNERGY_REFRESH_TOKEN

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
logging.level.root=INFO
logging.level.com.proaula.spring.synergy=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n