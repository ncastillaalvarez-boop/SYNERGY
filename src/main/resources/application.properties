spring.application.name=synergy

# ============================================================
# MONGODB CONFIGURATION
# ============================================================
spring.data.mongodb.uri=mongodb://localhost:27017/synergy
spring.data.mongodb.database=synergy
# ============================================================
# SERVER CONFIGURATION
# ============================================================
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# SSL CONFIGURATION 
server.ssl.enabled=false

# ============================================================
# THYMELEAF CONFIGURATION
# ============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================================
# JWT CONFIGURATION
# ============================================================
jwt.secret-key=528670c58052b8870432db3fc941b672bf50c01d39ea4912b38c55f2ad0cde76
jwt.expiration=780000
jwt.refresh-token=604800000
app.jwtSecret=528670c58052b8870432db3fc941b672bf50c01d39ea4912b38c55f2ad0cde76
app.jwtExpirationMs=780000
app.jwtRefreshExpirationMs=604800000
app.jwtCookieName=synergy_jwt
app.jwtRefreshCookieName=synergy_refresh

# ============================================================
# SESSION CONFIGURATION (Session Management)
# ============================================================
server.servlet.session.timeout=13m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.name=SYNERGY_SESSION
#spring.session.store-type=mongodb
spring.session.mongodb.collection-name=spring_session

# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
logging.level.root=INFO
logging.level.com.proaula.spring.synergy=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================================
# OAUTH2 CONFIGURATION
