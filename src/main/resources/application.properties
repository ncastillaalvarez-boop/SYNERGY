spring.application.name=synergy

# Claves privadas (Google OAuth, JWT). El archivo está en .gitignore: NO subirlo a GitHub.
spring.config.import=optional:classpath:application-secrets.properties

# ============================================================
# MONGODB
# ============================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/synergy}
spring.data.mongodb.database=synergy
# Los índices los crea Config/MongoIndexConfig al arrancar (tolera índices ya existentes)
spring.data.mongodb.auto-index-creation=false

# ============================================================
# SERVIDOR
# ============================================================
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.ssl.enabled=false

# Subida de archivos (entregas de tareas)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Fechas de los formularios en formato ISO (yyyy-MM-dd), igual que <input type="date">
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# ============================================================
# THYMELEAF
# ============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================================
# SESIÓN WEB
# ============================================================
server.servlet.session.timeout=13m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=SYNERGY_SESSION
# En producción con HTTPS poner SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ============================================================
# JWT (API REST para la app móvil)
# El valor real va en application-secrets.properties o en la variable JWT_SECRET
# ============================================================
app.jwtSecret=${JWT_SECRET:synergy_clave_de_desarrollo_cambiar_en_produccion_con_al_menos_64_caracteres_2026}
app.jwtExpirationMs=780000

# ============================================================
# INICIO DE SESIÓN CON GOOGLE
# Los valores reales van en application-secrets.properties
# o en las variables GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET.
# URI de redirección autorizada en Google Cloud:
#   http://localhost:8080/login/oauth2/code/google
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:configura-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:configura-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ============================================================
# DATOS DE PRUEBA (crea admin, líder y voluntario al arrancar)
# ============================================================
synergy.demo.enabled=true
synergy.demo.reset-passwords=true

# Volumen de datos (Config/GeneradorDatos). Se genera SOLO si hay menos proyectos que el mínimo.
# Total aproximado: 17.000 documentos. Contraseña de todos los usuarios generados: Synergy123*
synergy.datos.generar=true
synergy.datos.minimo-proyectos=200
synergy.datos.usuarios=2500
synergy.datos.proyectos=3000
synergy.datos.tareas=4000
synergy.datos.comentarios=1500

# Si la base tiene datos con el esquema de la versión anterior (poblar_synergy.py),
# se respaldan en la carpeta respaldos/ y se reemplazan por datos compatibles.
synergy.datos.reemplazar-esquema-antiguo=true
# Ponlo en true UNA vez para borrar (con respaldo) y regenerar todos los datos; luego vuelve a false.
synergy.datos.regenerar-todo=false
synergy.datos.carpeta-respaldos=respaldos

# ============================================================
# LOGS
# ============================================================
logging.level.root=INFO
logging.level.com.proaula.spring.synergy=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n
