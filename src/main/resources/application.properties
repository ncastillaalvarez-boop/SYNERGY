spring.application.name=synergy

# ============================================================
# MONGODB CONFIGURATION
# ============================================================
spring.data.mongodb.uri=mongodb://localhost:27017/synergy
spring.data.mongodb.database=synergy

# ============================================================
# SERVER CONFIGURATION
# ============================================================
server.port=8081
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ============================================================
# THYMELEAF CONFIGURATION
# ============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================================
# JWT CONFIGURATION
# ============================================================
app.jwtSecret=synergy_secret_key_2024_a_very_long_secret_key_for_jwt_encryption_production
app.jwtExpirationMs=86400000

# ============================================================
# SESSION CONFIGURATION (Session Management)
# ============================================================
server.servlet.session.timeout=30m
#spring.session.store-type=mongodb
spring.session.mongodb.collection-name=spring_session

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
logging.level.root=INFO
logging.level.com.proaula.spring.synergy=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
