<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Registro – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/auth.css" th:href="@{/css/auth.css}">
  <style>.theme-icon-light{display:none}[data-theme="light"] .theme-icon-dark{display:none}[data-theme="light"] .theme-icon-light{display:inline-block}</style>
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <a th:href="@{/seleccionar-rol}" class="btn btn-secondary btn-sm back-btn" aria-label="Volver">
    <i class="fa-solid fa-arrow-left"></i> Volver
  </a>

  <button type="button" class="btn btn-secondary btn-icon theme-float" data-theme-toggle aria-label="Cambiar tema claro u oscuro">
    <i class="fa-solid fa-moon theme-icon-dark"></i>
    <i class="fa-solid fa-sun theme-icon-light"></i>
  </button>

  <main class="auth-page">
    <div class="auth-card">

      <img src="../static/img/logo.png" th:src="@{/img/logo.png}" alt="Logo Synergy" class="auth-logo">

      <div class="rol-badge"><i class="fa-solid fa-hand-holding-heart"></i> Voluntario</div>

      <h1 class="auth-title">Regístrate</h1>
      <p class="auth-subtitle">Crea tu cuenta de Synergy</p>

      <div th:if="${error}" class="alert alert-error" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}"></span>
      </div>

      <form th:action="@{/registrarse}" th:object="${usuario}" method="post" data-loading>

        <div class="float-field">
          <i class="fa-regular fa-user field-icon"></i>
          <input type="text" th:field="*{nombre}" placeholder=" " autocomplete="name" required>
          <label th:for="nombre">Nombre</label>
        </div>

        <div class="float-field">
          <i class="fa-regular fa-envelope field-icon"></i>
          <input type="email" th:field="*{correo}" placeholder=" " autocomplete="email" required>
          <label th:for="correo">Correo electrónico</label>
        </div>

        <div class="float-field">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" th:field="*{contrasena}" placeholder=" " autocomplete="new-password" required>
          <label th:for="contrasena">Contraseña</label>
          <button type="button" class="toggle-pass" aria-label="Mostrar contraseña"><i class="fa-regular fa-eye"></i></button>
        </div>

        <div class="float-field">
          <i class="fa-solid fa-shield-halved field-icon"></i>
          <input type="password" id="confirmarContrasena" name="confirmarContrasena" placeholder=" " autocomplete="new-password" required>
          <label for="confirmarContrasena">Confirmar contraseña</label>
          <button type="button" class="toggle-pass" aria-label="Mostrar contraseña"><i class="fa-regular fa-eye"></i></button>
        </div>

        <input type="hidden" name="rol" value="PARTICIPANTE">

        <button type="submit" class="btn btn-primary btn-submit">
          <i class="fa-solid fa-user-plus"></i> Registrarse
        </button>

        <div class="divider">o regístrate con</div>

        <a th:href="@{/login/google}" class="btn btn-google btn-block">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Registrarme con Google
        </a>

        <p class="auth-footer">
          ¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión</a>
        </p>
      </form>

    </div>
  </main>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
