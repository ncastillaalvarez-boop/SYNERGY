<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro – Synergy</title>
  <link rel="stylesheet" th:href="@{/css/Registro.css}">
</head>
<body>

<section class="hero">
  <div class="overlay"></div>

    <!-- Botón pequeño que lleva al index -->
  <a th:href="@{/}" class="btn-small" 
     style="position:absolute; top:20px; left:20px; z-index:9999;">
    ←
  </a>
  
  <div class="container">
    <div class="card">

      <img th:src="@{/img/Logo.png}" alt="Logo Synergy" class="Logo">

      <h1>Regístrate</h1>
      <p class="subtitle">Crea tu cuenta de Synergy</p>

      <form th:action="@{/registrarse}" th:object="${usuario}" method="post">

        

        <div class="input-group">
          <input type="text" th:field="*{nombre}" required>
          <label>Nombre</label>
        </div>

        <div class="input-group">
          <input type="email" th:field="*{correo}" required>
          <label>Correo electrónico</label>
        </div>

        <div class="input-group">
          <input type="password" th:field="*{contrasena}" required>
          <label>Contraseña</label>
        </div>

        <div class="input-group">
          <input type="password" name="confirmarContrasena" required>
          <label>Confirmar contraseña</label>
        </div>

        <!-- CAMBIO IMPORTANTE -->
        <input type="hidden" name="rol" value="PARTICIPANTE">

        <button type="submit">Registrarse</button>

        <a th:href="@{/oauth2/authorization/google}" class="btn-google" style="display:flex; align-items:center; justify-content:center; gap:10px; margin-top:10px; background-color:#fff; color:#333; padding:10px; border-radius:5px; text-decoration:none; font-weight:bold; border: 1px solid #ccc;">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="20" height="20">
          Registrarse con Google
        </a>

        <p class="login-text">
          ¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión</a>
        </p>
      </form>

    </div>
  </div>
</section>

</body>
</html>
