<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Editar Proyecto – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

  <div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('lider-proyectos')}"></div>
  <div class="app-main">
  <div th:replace="~{fragments/sidebar :: topbar}"></div>

  <main class="app-container is-narrow">
    <section class="app-card">

      <!-- ENCABEZADO -->
      <header class="page-header">
        <nav class="page-toolbar">
          <div class="toolbar-group">
            <a th:href="@{/lider/dashboard}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver</a>
          </div>
          <a th:href="@{/}" class="mini-brand"><span class="mini-brand-mark"><img src="../static/img/logo-mark.png" th:src="@{/img/logo-mark.png}" alt=""></span><span>Synergy</span></a>
        </nav>
        <div class="page-heading">
          <span class="page-icon has-img"><img src="../static/img/icons/ajustes.png" th:src="@{/img/icons/ajustes.png}" alt="" loading="lazy"></span>
          <div>
            <h1 class="page-title">Editar Proyecto</h1>
            <p class="page-subtitle">Modifica los datos del proyecto.</p>
          </div>
        </div>
      </header>


      <div th:if="${mensaje}" class="alert alert-success" data-autohide>
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${mensaje}"></span>
      </div>
      <div th:if="${error}" class="alert alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}"></span>
      </div>

      <!-- FORMULARIO -->
      <form th:action="@{/lider/proyecto/{id}/actualizar(id=${proyecto.id})}"
            th:object="${proyecto}" method="post" data-loading>
        <input type="hidden" name="origen" value="editar">

        <div class="form-grid">
          <div class="field span-2">
            <label th:for="nombre"><i class="fa-solid fa-signature"></i> Nombre del proyecto</label>
            <input type="text" th:field="*{nombre}" placeholder="Nombre del proyecto" required />
          </div>

          <div class="field span-2">
            <label th:for="descripcion"><i class="fa-solid fa-align-left"></i> Descripción</label>
            <textarea th:field="*{descripcion}" placeholder="Descripción del proyecto..." rows="4" required></textarea>
          </div>

          <div class="field">
            <label th:for="fechaInicio"><i class="fa-regular fa-calendar"></i> Fecha de inicio</label>
            <input type="date" th:field="*{fechaInicio}" required />
          </div>

          <div class="field">
            <label th:for="fechaFin"><i class="fa-regular fa-calendar-check"></i> Fecha de fin</label>
            <input type="date" th:field="*{fechaFin}" required />
          </div>

          <div class="field">
            <label th:for="categoria"><i class="fa-solid fa-leaf"></i> Categoría</label>
            <select th:field="*{categoria}" required>
              <option value="">Selecciona…</option>
              <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}">Categoría</option>
            </select>
          </div>

          <div class="field">
            <label th:for="ubicacion"><i class="fa-solid fa-location-dot"></i> Barrio / sector</label>
            <select th:field="*{ubicacion}" required>
              <option value="">Selecciona…</option>
              <option th:each="b : ${barrios}" th:value="${b}" th:text="${b}">Barrio</option>
            </select>
          </div>

          <div class="field">
            <label th:for="tipoOrganizacion"><i class="fa-solid fa-building"></i> Organización</label>
            <select th:field="*{tipoOrganizacion}" required>
              <option value="">Selecciona…</option>
              <option th:each="o : ${organizaciones}" th:value="${o}" th:text="${o}">Org</option>
            </select>
          </div>

          <div class="field">
            <label th:for="audiencia"><i class="fa-solid fa-bullseye"></i> Dirigido a</label>
            <select th:field="*{audiencia}">
              <option value="">Público general</option>
              <option th:each="a : ${audiencias}" th:value="${a}" th:text="${a}">Audiencia</option>
            </select>
          </div>
          <div class="field span-2" th:if="${proyecto.estado != 'PENDIENTE'}">
            <label th:for="estado"><i class="fa-solid fa-signal"></i> Estado</label>
            <select th:field="*{estado}">
              <option value="ACTIVO">Activo</option>
              <option value="COMPLETADO">Completado</option>
              <option value="CANCELADO">Cancelado</option>
            </select>
          </div>
          <div class="field span-2" th:if="${proyecto.estado == 'PENDIENTE'}">
            <div class="alert alert-warning" style="margin:0">
              <i class="fa-solid fa-hourglass-half"></i>
              <span>Este proyecto está <strong>pendiente de aprobación</strong>: el administrador lo publicará.</span>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-lg"><i class="fa-solid fa-floppy-disk"></i> Guardar cambios</button>
          <a th:href="@{/lider/dashboard}" class="btn btn-secondary btn-lg">Cancelar</a>
        </div>

      </form>

    </section>
  </main>
  </div>
</div>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
