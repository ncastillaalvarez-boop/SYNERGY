<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Mis Proyectos – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

  <div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('proponer')}"></div>
  <div class="app-main">
  <div th:replace="~{fragments/sidebar :: topbar}"></div>

  <main class="app-container">
    <section class="app-card">

      <!-- ENCABEZADO -->
      <header class="page-header">
        <nav class="page-toolbar">
          <div class="toolbar-group">
            <a th:href="@{/proyectos/dashboard}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver</a>
          </div>
          <a th:href="@{/}" class="mini-brand"><span class="mini-brand-mark"><img src="../static/img/logo-mark.png" th:src="@{/img/logo-mark.png}" alt=""></span><span>Synergy</span></a>
        </nav>
        <div class="page-heading">
          <span class="page-icon has-img"><img src="../static/img/icons/proyectos.png" th:src="@{/img/icons/proyectos.png}" alt="" loading="lazy"></span>
          <div>
            <h1 class="page-title">Mis Proyectos</h1>
            <p class="page-subtitle">Selecciona un proyecto para asignar tareas.</p>
          </div>
        </div>
      </header>

      <!-- Mensaje si no hay proyectos -->
      <div th:if="${proyectos.size() == 0}" class="empty-state">
        <div class="empty-state-icon"><i class="fa-regular fa-folder-open"></i></div>
        <h3>Sin proyectos</h3>
        <p>No has creado ningún proyecto todavía.</p>
      </div>

      <!-- LISTA DE PROYECTOS -->
      <div class="list">
        <div th:each="proyecto, st : ${proyectos}" class="list-row" th:style="'--i:' + ${st.index}">
          <div class="list-row-main">
            <span class="item-card-icon"><i class="fa-solid fa-diagram-project"></i></span>
            <span class="list-row-title" th:text="${proyecto.nombre}">Nombre del proyecto</span>
          </div>
          <a th:href="@{/tareas/asignar/{id}(id=${proyecto.id})}" class="btn btn-success">
            <i class="fa-solid fa-list-check"></i> Asignar tareas
          </a>
        </div>
      </div>

    </section>
  </main>
  </div>
</div>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
