<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Historial de Acciones - Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

  <div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('historial')}"></div>
  <div class="app-main">
  <div th:replace="~{fragments/sidebar :: topbar}"></div>

  <main class="app-container">
    <section class="app-card">

      <header class="page-header">
        <nav class="page-toolbar">
          <div class="toolbar-group">
            <a th:href="@{/proyectos}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver a Proyectos</a>
          </div>
          <a th:href="@{/}" class="mini-brand"><span class="mini-brand-mark"><img src="../static/img/logo-mark.png" th:src="@{/img/logo-mark.png}" alt=""></span><span>Synergy</span></a>
        </nav>
        <div class="page-heading">
          <span class="page-icon has-img"><img src="../static/img/icons/progreso.png" th:src="@{/img/icons/progreso.png}" alt="" loading="lazy"></span>
          <div>
            <h1 class="page-title">Historial de Acciones</h1>
            <p class="page-subtitle">Total de acciones registradas: <strong th:text="${totalAcciones}">0</strong></p>
          </div>
        </div>
      </header>

      <!-- Mensaje de feedback -->
      <div th:if="${mensaje}" class="alert alert-success" data-autohide>
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${mensaje}"></span>
      </div>

      <!-- Controles -->
      <div class="cluster mb-3">
        <form th:action="@{/historial/deshacer}" method="post" class="inline-form">
          <button type="submit" class="btn btn-warning" th:disabled="${!hayDeshacer}">
            <i class="fa-solid fa-rotate-left"></i> Deshacer
          </button>
        </form>

        <form th:action="@{/historial/rehacer}" method="post" class="inline-form">
          <button type="submit" class="btn btn-info" th:disabled="${!hayRehacer}">
            <i class="fa-solid fa-rotate-right"></i> Rehacer
          </button>
        </form>

        <form th:action="@{/historial/limpiar}" method="post" class="inline-form"
              data-confirm="¿Estás seguro de limpiar todo el historial?">
          <button type="submit" class="btn btn-danger">
            <i class="fa-solid fa-broom"></i> Limpiar Historial
          </button>
        </form>
      </div>

      <!-- Timeline de acciones -->
      <div th:if="${historial != null && !historial.isEmpty()}" class="timeline">
        <div th:each="accion, st : ${historial}" class="timeline-item"
             th:classappend="'tipo-' + ${accion.tipo}" th:style="'--i:' + ${st.index}">
          <div class="timeline-head">
            <div class="cluster">
              <span class="badge accion-tipo"
                    th:classappend="'tipo-' + ${accion.tipo}"
                    th:text="${accion.icono} + ' ' + ${accion.tipo}"></span>
              <span class="badge no-dot" th:text="${accion.entidad}"></span>
            </div>
            <span class="timeline-date"><i class="fa-regular fa-clock"></i> <span th:text="${accion.fechaFormateada}"></span></span>
          </div>

          <div class="timeline-desc" th:text="${accion.descripcion}"></div>

          <div class="meta">
            <span><i class="fa-regular fa-user"></i> Usuario: <strong th:text="${accion.usuario}"></strong></span>
          </div>
        </div>
      </div>

      <!-- Historial vacío -->
      <div th:if="${historial == null || historial.isEmpty()}" class="empty-state">
        <div class="empty-state-icon"><i class="fa-regular fa-folder-open"></i></div>
        <h3>No hay acciones registradas</h3>
        <p>El historial está vacío. Las acciones que realices aparecerán aquí.</p>
      </div>

    </section>
  </main>
  </div>
</div>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
