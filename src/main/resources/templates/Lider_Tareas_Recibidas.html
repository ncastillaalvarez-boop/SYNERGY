<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Entregas recibidas – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('lider-entregas')}"></div>
  <div class="app-main">
  <div th:replace="~{fragments/sidebar :: topbar}"></div>

  <main class="app-container">
    <section class="app-card">
      <header class="page-header">
        <div class="page-heading">
          <span class="page-icon has-img"><img src="../static/img/icons/reporte-fotografico.png" th:src="@{/img/icons/reporte-fotografico.png}" alt=""></span>
          <div>
            <h1 class="page-title">Entregas recibidas</h1>
            <p class="page-subtitle">Evidencias enviadas por los voluntarios. Apruébalas o recházalas.</p>
          </div>
        </div>
      </header>

      <div th:if="${mensaje}" class="alert alert-success" data-autohide>
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${mensaje}"></span>
      </div>
      <div th:if="${error}" class="alert alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}"></span>
      </div>

      <nav class="segmented segmented-wide" aria-label="Filtrar entregas" th:if="${totalEntregas > 0}">
        <a th:href="@{/lider/tareas/recibidas}" th:classappend="${estadoFiltro == null} ? 'is-active'">Todas <span class="count" th:text="${totalEntregas}">0</span></a>
        <a th:href="@{/lider/tareas/recibidas(estado='ENTREGADO')}" th:classappend="${estadoFiltro == 'ENTREGADO'} ? 'is-active'">Por revisar <span class="count" th:text="${conteoEstados['ENTREGADO']}">0</span></a>
        <a th:href="@{/lider/tareas/recibidas(estado='REVISADO')}" th:classappend="${estadoFiltro == 'REVISADO'} ? 'is-active'">Aprobadas <span class="count" th:text="${conteoEstados['REVISADO']}">0</span></a>
        <a th:href="@{/lider/tareas/recibidas(estado='RECHAZADO')}" th:classappend="${estadoFiltro == 'RECHAZADO'} ? 'is-active'">Rechazadas <span class="count" th:text="${conteoEstados['RECHAZADO']}">0</span></a>
      </nav>

      <div th:if="${#lists.isEmpty(entregas)}" class="empty-state">
        <div class="empty-state-icon has-img"><img src="../static/img/icons/notificaciones.png" th:src="@{/img/icons/notificaciones.png}" alt="" class=""></div>
        <h3 th:text="${estadoFiltro == 'ENTREGADO'} ? '¡Todo revisado!' : 'Sin entregas todavía'">Sin entregas todavía</h3>
        <p th:text="${estadoFiltro == 'ENTREGADO'} ? 'No tienes entregas esperando revisión.' : 'Cuando un voluntario entregue una tarea, aparecerá aquí.'">Cuando un voluntario entregue una tarea, aparecerá aquí.</p>
        <a th:if="${totalEntregas == 0}" th:href="@{/lider/tareas/asignar}" class="btn btn-primary mt-2"><i class="fa-solid fa-plus"></i> Asignar tareas</a>
      </div>
      <div class="list">
        <div class="list-row" th:each="e, st : ${entregas}" th:style="'--i:' + ${st.index}">
          <div class="list-row-main">
            <span class="avatar" th:text="${e.inicialesUsuario}">AB</span>
            <div class="list-row-body">
              <div class="list-row-title" th:text="${e.titulo}">Tarea</div>
              <div class="list-row-desc"><span th:text="${e.nombreUsuario}">Voluntario</span> · <span th:text="${e.proyecto}">Proyecto</span></div>
              <div class="meta">
                <span><i class="fa-regular fa-clock"></i> <span th:text="${e.fechaEntrega != null ? #temporals.format(e.fechaEntrega, 'dd/MM/yyyy HH:mm') : '-'}">-</span></span>
                <span><i class="fa-solid fa-paperclip"></i> <span th:text="${e.nombreArchivo}">archivo</span></span>
                <span class="badge" th:text="${e.estado}"
                      th:classappend="${e.estado == 'REVISADO'} ? 'badge-success' : (${e.estado == 'RECHAZADO'} ? 'badge-danger' : 'badge-info')">ENTREGADO</span>
              </div>
            </div>
          </div>
          <div class="table-actions">
            <a th:href="@{/lider/entregas/{id}/archivo(id=${e.id})}" class="btn btn-info btn-sm"><i class="fa-solid fa-download"></i> Descargar</a>
            <form th:if="${e.estado != 'REVISADO'}" th:action="@{/lider/entregas/{id}/revisar(id=${e.id})}" method="post" class="inline-form">
              <input type="hidden" name="estado" value="REVISADO">
              <button type="submit" class="btn btn-success btn-sm"><i class="fa-solid fa-check"></i> Aprobar</button>
            </form>
            <form th:if="${e.estado != 'RECHAZADO'}" th:action="@{/lider/entregas/{id}/revisar(id=${e.id})}" method="post" class="inline-form">
              <input type="hidden" name="estado" value="RECHAZADO">
              <button type="submit" class="btn btn-danger btn-sm" data-confirm="La tarea volverá a quedar pendiente para el voluntario." data-confirm-ok="Rechazar"><i class="fa-solid fa-xmark"></i> Rechazar</button>
            </form>
          </div>
        </div>
      </div>

    </section>
  </main>
  </div>
</div>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
