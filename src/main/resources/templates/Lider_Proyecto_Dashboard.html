<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Líder – Synergy</title>
  <link rel="stylesheet" href="/css/Administrador_Dashboard.css">
  <link rel="stylesheet" href="/css/Usuarios_Dashboard.css">
</head>

<body>

  <div class="hero">
    <div class="overlay"></div>

    <div class="container">
      <div class="card">

        <!-- ENCABEZADO -->
        <div class="header">
          <div class="top-buttons">

            <!-- Inicio -->
            <a th:href="@{/index}" class="btn-inicio">Inicio</a>

            <!-- Logout -->
            <a th:href="@{/logout}" class="btn-usuarios">Cerrar sesión</a>

          </div>

          <h1>Panel del Líder</h1>
          <p class="subtitle">Gestiona tu proyecto fácilmente.</p>
        </div>

        <!-- OPCIONES PRINCIPALES -->
        <div class="menu-options">

          <a th:href="@{/lider/tareas/asignar}" class="menu-btn">
            📝 Asignar tareas
          </a>

          <a th:href="@{/lider/usuarios}" class="menu-btn">
            👥 Ver usuarios inscritos al proyecto
          </a>

          <a th:href="@{/lider/tareas/recibidas}" class="menu-btn">
            📥 Ver tareas recibidas
          </a>

          <a th:href="@{/lider/proyecto/nuevo}" class="menu-btn">
            ➕ Crear nuevo proyecto
          </a>

        </div>
        <!-- MIS PROYECTOS -->
        <div class="proyectos-lista">
          <h2>Mis proyectos</h2>

          <!-- Barra de Búsqueda de Proyectos -->
          <div style="margin-bottom: 20px;">
            <input type="text" id="buscadorLider" onkeyup="filtrarProyectosLider()" placeholder="🔍 Buscar proyecto por nombre..."
                   style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(15,23,42,0.6); color: white; font-size: 16px;">
          </div>

        <div th:if="${#lists.isEmpty(proyectos)}">
          <p>No tienes proyectos creados aún.</p>
       </div>

        <div th:each="proyecto : ${proyectos}" class="proyecto-card">
          <h3 th:text="${proyecto.nombre}">Nombre del proyecto</h3>
          <p th:text="${proyecto.descripcion}">Descripción</p>

        <div class="proyecto-acciones">

          <!-- Editar -->
          <a th:href="@{/lider/proyecto/{id}/editar(id=${proyecto.id})}" class="btn-editar">
             ✏️ Editar
          </a>

          <!-- Eliminar -->
          <form th:action="@{/lider/proyecto/{id}/eliminar(id=${proyecto.id})}" method="post">
            <button type="submit" class="btn-eliminar"
              onclick="return confirm('¿Estás seguro de eliminar este proyecto?')">
              🗑️ Eliminar
            </button>
          </form>

      </div>
    </div>
  </div>

<script>
function filtrarProyectosLider() {
  const filter = document.getElementById("buscadorLider").value.toLowerCase();
  const cards = document.querySelectorAll(".proyecto-card");
  
  cards.forEach(card => {
    const nombre = card.querySelector("h3").textContent.toLowerCase();
    
    if (nombre.includes(filter)) {
      card.style.display = "";
    } else {
      card.style.display = "none";
    }
  });
}
</script>
</body>

</html>
