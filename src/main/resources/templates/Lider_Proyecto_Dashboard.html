<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Líder – Synergy</title>
  <link rel="stylesheet" href="/css/Administrador_Dashboard.css">
  <link rel="stylesheet" href="/css/Usuarios_Dashboard.css">
</head>

<body>

  <div class="hero">
    <div class="overlay"></div>

    <div class="container">
      <div class="card">

        <!-- ENCABEZADO -->
        <div class="header">
          <div class="top-buttons">
            <a th:href="@{/index}" class="btn-inicio">Inicio</a>
            <a th:href="@{/logout}" class="btn-usuarios">Cerrar sesión</a>
          </div>
          <h1>Panel del Líder</h1>
          <p class="subtitle">Gestiona tu proyecto fácilmente.</p>
        </div>

        <!-- OPCIONES PRINCIPALES -->
        <div class="menu-options">
          <a th:href="@{/lider/tareas/asignar}" class="menu-btn">
            📝 Asignar tareas
          </a>
          <a th:href="@{/lider/usuarios}" class="menu-btn">
            👥 Ver usuarios inscritos al proyecto
          </a>
          <a th:href="@{/lider/tareas/recibidas}" class="menu-btn">
            📥 Ver tareas recibidas
          </a>
          <a th:href="@{/lider/proyecto/nuevo}" class="menu-btn">
            ➕ Crear nuevo proyecto
          </a>
        </div>

        <!-- MIS PROYECTOS -->
        <div class="seccion-panel">

          <div class="seccion-panel-header">
            <span>📁 Mis proyectos</span>
          </div>

          <div class="seccion-panel-body">

            <!-- Filtros -->
            <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center;">
              <input type="text" id="buscadorLider" oninput="filtrarDashboard()"
                     placeholder="🔍 Buscar por nombre..."
                     class="buscador-input" style="flex:1; min-width:160px;">
              <select id="filtroEstadoDash" onchange="filtrarDashboard()"
                      style="padding:7px 12px; border:1px solid #ccc; border-radius:20px; font-size:13px;">
                <option value="">Todos los estados</option>
                <option value="ACTIVO">Activo</option>
                <option value="COMPLETADO">Completado</option>
                <option value="CANCELADO">Cancelado</option>
              </select>
              <select id="filtroOrgDash" onchange="filtrarDashboard()"
                      style="padding:7px 12px; border:1px solid #ccc; border-radius:20px; font-size:13px;">
                <option value="">Todas las organizaciones</option>
                <option value="Empresa">Empresa</option>
                <option value="Proyecto estudiantil">Proyecto estudiantil</option>
                <option value="ONG">ONG</option>
                <option value="Institución educativa">Institución educativa</option>
                <option value="Entidad gubernamental">Entidad gubernamental</option>
                <option value="Comunidad">Comunidad</option>
                <option value="Otro">Otro</option>
              </select>
            </div>

            <div th:if="${#lists.isEmpty(proyectos)}" class="seccion-empty">
              No tienes proyectos creados aún.
            </div>

            <div id="listaProyectosDash">
              <div th:each="proyecto, iter : ${proyectos}"
                   class="proyecto-card"
                   th:attr="data-nombre=${proyecto.nombre},data-estado=${proyecto.estado},data-org=${proyecto.tipoOrganizacion}"
                   th:classappend="${iter.index >= 5} ? ' oculto-dash' : ''">

                <!-- Badge organización -->
                <div style="margin-bottom:6px;">
                  <span th:if="${proyecto.tipoOrganizacion != null}"
                        th:text="${proyecto.tipoOrganizacion}"
                        style="background:#e8f5f1; color:#0F6E56; border-radius:12px;
                               padding:2px 10px; font-size:11px; font-weight:700;">
                  </span>
                  <span th:if="${proyecto.tipoOrganizacion == null}"
                        style="background:#f0f0f0; color:#999; border-radius:12px;
                               padding:2px 10px; font-size:11px; font-weight:600;">
                    Sin organización definida
                  </span>
                </div>

                <h3 th:text="${proyecto.nombre}">Nombre del proyecto</h3>
                <p th:text="${proyecto.descripcion}">Descripción</p>

                <!-- Badge estado -->
                <span th:text="${proyecto.estado}"
                      th:style="${proyecto.estado == 'ACTIVO'} ? 'background:#d4edda; color:#155724;' :
                                 (${proyecto.estado == 'COMPLETADO'} ? 'background:#cce5ff; color:#004085;' :
                                 'background:#f8d7da; color:#721c24;')"
                      style="font-size:11px; font-weight:700; border-radius:12px; padding:2px 10px; display:inline-block; margin-bottom:8px;">
                </span>

                <div class="proyecto-acciones">
                  <a th:href="@{/lider/proyecto/{id}/editar(id=${proyecto.id})}" class="btn-editar">
                    ✏️ Editar
                  </a>
                  <form th:action="@{/lider/proyecto/{id}/eliminar(id=${proyecto.id})}" method="post"
                        style="display:inline;">
                    <button type="submit" class="btn-eliminar"
                      onclick="return confirm('¿Estás seguro de eliminar este proyecto?')">
                      🗑️ Eliminar
                    </button>
                  </form>
                </div>
              </div>
            </div>

            <!-- Ver más / Ver menos -->
            <div id="verMasWrapper" th:if="${#lists.size(proyectos) > 5}"
                 style="text-align:center; margin-top:12px;">
              <button id="btnVerMas" onclick="toggleVerMas()"
                      style="background:none; border:1px solid #0F6E56; color:#0F6E56;
                             border-radius:20px; padding:6px 20px; font-size:13px;
                             cursor:pointer; font-weight:600;">
                Ver más proyectos ▼
              </button>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <style>
    .oculto-dash { display: none !important; }
  </style>

  <script>
    var mostrandoTodos = false;

    function toggleVerMas() {
      mostrandoTodos = !mostrandoTodos;
      document.querySelectorAll('.oculto-dash').forEach(function(el) {
        el.style.display = mostrandoTodos ? '' : 'none';
      });
      var btn = document.getElementById('btnVerMas');
      if (btn) btn.textContent = mostrandoTodos ? 'Ver menos ▲' : 'Ver más proyectos ▼';
    }

    function filtrarDashboard() {
      var texto  = document.getElementById('buscadorLider').value.toLowerCase();
      var estado = document.getElementById('filtroEstadoDash').value.toLowerCase();
      var org    = document.getElementById('filtroOrgDash').value.toLowerCase();
      var idx = 0;
      document.querySelectorAll('.proyecto-card').forEach(function(card) {
        var nombre = (card.getAttribute('data-nombre') || '').toLowerCase();
        var est    = (card.getAttribute('data-estado') || '').toLowerCase();
        var orgVal = (card.getAttribute('data-org')    || '').toLowerCase();
        var ok = nombre.includes(texto)
              && (estado === '' || est === estado)
              && (org    === '' || orgVal.includes(org));
        if (ok) {
          card.style.display = '';
          card.classList.remove('oculto-dash');
        } else {
          card.style.display = 'none';
        }
        idx++;
      });
      var wrapper = document.getElementById('verMasWrapper');
      if (wrapper) wrapper.style.display = 'none';
    }
  </script>

</body>
</html>
