<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Detalles del proyecto – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('admin-proyectos')}"></div>
  <div class="app-main">
  <div th:replace="~{fragments/sidebar :: topbar}"></div>

  <main class="app-container is-narrow">
    <section class="app-card">
      <header class="page-header">
        <nav class="page-toolbar">
          <div class="toolbar-group">
            <a th:href="@{/admin/proyectos}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver</a>
            <a th:href="@{/proyectos/{id}/comentarios(id=${proyecto.id})}" class="btn btn-info btn-sm"><i class="fa-regular fa-comments"></i> Comentarios</a>
          </div>
        </nav>
        <div class="page-heading">
          <span class="page-icon has-img"><img src="../static/img/icons/proyectos.png" th:src="@{/img/icons/proyectos.png}" alt=""></span>
          <div>
            <h1 class="page-title">Detalles del proyecto</h1>
            <p class="page-subtitle">Revisa la información antes de aprobarlo o eliminarlo.</p>
          </div>
        </div>
      </header>

      <div class="detail-panel">
        <h2 class="detail-panel-title" th:text="${proyecto.nombre}">Nombre del proyecto</h2>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-hashtag"></i> Código</span>
          <span class="detail-value project-code" th:text="${proyecto.codigo ?: '—'}">SYN</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-leaf"></i> Categoría</span>
          <span class="detail-value" th:text="${proyecto.categoria ?: 'Sin categoría'}">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-location-dot"></i> Barrio</span>
          <span class="detail-value" th:text="${proyecto.ubicacion ?: 'No indicado'}">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-building"></i> Organización</span>
          <span class="detail-value" th:text="${proyecto.tipoOrganizacion ?: 'No indicada'}">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-bullseye"></i> Dirigido a</span>
          <span class="detail-value" th:text="${proyecto.audiencia ?: 'Público general'}">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-signal"></i> Estado</span>
          <span class="detail-value"><span class="badge" th:classappend="${proyecto.estado == 'ACTIVO'} ? 'badge-success is-live' : (${proyecto.estado == 'PENDIENTE'} ? 'badge-warning' : (${proyecto.estado == 'COMPLETADO'} ? 'badge-info' : 'badge-danger'))" th:text="${proyecto.estadoEtiqueta}">ACTIVO</span></span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-align-left"></i> Descripción</span>
          <span class="detail-value" th:text="${proyecto.descripcion != null ? proyecto.descripcion : 'Sin descripción'}">Descripción</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-user-tie"></i> Líder</span>
          <span class="detail-value" th:text="${nombreLider}">Líder</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-users"></i> Integrantes</span>
          <span class="detail-value"><span th:text="${proyecto.totalVoluntarios}">0</span> voluntarios</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-regular fa-calendar"></i> Fecha de inicio</span>
          <span class="detail-value" th:text="${proyecto.fechaInicio != null ? #temporals.format(proyecto.fechaInicio, 'dd/MM/yyyy') : 'No definida'}">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-regular fa-calendar-check"></i> Fecha de fin</span>
          <span class="detail-value" th:text="${proyecto.fechaFin != null ? #temporals.format(proyecto.fechaFin, 'dd/MM/yyyy') : 'No definida'}">-</span>
        </div>
      </div>

      <div class="form-actions" style="justify-content:center;">
        <form th:if="${proyecto.estado == 'PENDIENTE'}" th:action="@{/admin/proyecto/{id}/aceptar(id=${proyecto.id})}" method="post" class="inline-form">
          <button type="submit" class="btn btn-primary btn-lg"><i class="fa-solid fa-circle-check"></i> Aprobar proyecto</button>
        </form>
        <form th:if="${proyecto.estado == 'PENDIENTE'}" th:action="@{/admin/proyecto/{id}/rechazar(id=${proyecto.id})}" method="post" class="inline-form">
          <button type="submit" class="btn btn-secondary btn-lg" data-confirm="¿Rechazar esta propuesta?" data-confirm-ok="Rechazar"><i class="fa-solid fa-ban"></i> Rechazar</button>
        </form>
        <form th:action="@{/admin/proyecto/{id}/eliminar(id=${proyecto.id})}" method="post" class="inline-form">
          <button type="submit" class="btn btn-danger btn-lg" data-confirm="¿Eliminar definitivamente este proyecto? También se borrarán sus tareas, entregas y comentarios." data-confirm-ok="Eliminar">
            <i class="fa-regular fa-trash-can"></i> Eliminar proyecto
          </button>
        </form>
      </div>

    </section>
  </main>
  </div>
</div>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
