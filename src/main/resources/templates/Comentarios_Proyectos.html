<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Comentarios – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('mis-proyectos')}"></div>
  <div class="app-main">
  <div th:replace="~{fragments/sidebar :: topbar}"></div>

  <main class="app-container is-narrow">
    <section class="app-card">
      <header class="page-header">
        <nav class="page-toolbar">
          <div class="toolbar-group">
            <a th:href="@{${volverA}}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver</a>
            
          </div>
        </nav>
        <div class="page-heading">
          <span class="page-icon has-img"><img src="../static/img/icons/comunidad.png" th:src="@{/img/icons/comunidad.png}" alt=""></span>
          <div>
            <h1 class="page-title" th:text="${proyecto.nombre}">Proyecto</h1>
            <p class="page-subtitle" th:text="'Buzón de comentarios del proyecto'">Descripción</p>
          </div>
        </div>
      </header>

      <div th:if="${mensaje}" class="alert alert-success" data-autohide>
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${mensaje}"></span>
      </div>
      <div th:if="${error}" class="alert alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}"></span>
      </div>

      <h2 class="section-heading"><i class="fa-regular fa-comment-dots"></i> Escribir un comentario</h2>
      <div class="panel">
        <form th:action="@{/proyectos/enviar-comentario}" method="post" class="stack" data-loading>
          <input type="hidden" name="proyectoId" th:value="${proyecto.id}">
          <div class="field">
            <label for="comentario" class="sr-only">Comentario</label>
            <textarea id="comentario" name="comentario" maxlength="2000" placeholder="Comparte avances, dudas o ideas con tu equipo..." required></textarea>
          </div>
          <div><button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Publicar</button></div>
        </form>
      </div>

      <h2 class="section-heading"><i class="fa-solid fa-comments"></i> Comentarios
        <span class="count" th:text="${#lists.size(comentarios)}">0</span></h2>
      <div class="panel">
        <div class="comment" th:each="c : ${comentarios}">
          <span class="avatar" th:text="${c.iniciales}">US</span>
          <div class="comment-body">
            <div class="comment-head">
              <strong class="comment-author" th:text="${c.autor}">Usuario</strong>
              <div class="cluster">
                <small th:text="${c.fecha != null ? #temporals.format(c.fecha, 'dd/MM/yyyy HH:mm') : ''}">08/11/2025 15:30</small>
                <form th:if="${c.propio or proyecto.idLider == usuarioActual.id or rolActual == 'ADMINISTRADOR'}"
                      th:action="@{/proyectos/comentarios/eliminar/{id}(id=${c.id})}" method="post" class="inline-form">
                  <input type="hidden" name="proyectoId" th:value="${proyecto.id}">
                  <button type="submit" class="btn btn-ghost btn-sm btn-icon" title="Eliminar comentario" aria-label="Eliminar comentario"
                          data-confirm="¿Eliminar este comentario?" data-confirm-ok="Eliminar"><i class="fa-regular fa-trash-can"></i></button>
                </form>
              </div>
            </div>
            <p class="comment-text" th:text="${c.contenido}">Comentario</p>
          </div>
        </div>
        <p th:if="${#lists.isEmpty(comentarios)}" class="text-subtle">Aún no hay comentarios. ¡Sé el primero!</p>
      </div>

      <h2 class="section-heading"><i class="fa-solid fa-list-check"></i> Tareas</h2>
      <div class="panel">
        <ul class="task-list">
          <li th:each="t : ${tareas}"><span><strong th:text="${t.titulo}">Tarea</strong> · <span th:text="${t.estado}">PENDIENTE</span></span></li>
        </ul>
        <p th:if="${#lists.isEmpty(tareas)}" class="text-subtle">No hay tareas para mostrar.</p>
      </div>

    </section>
  </main>
  </div>
</div>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
