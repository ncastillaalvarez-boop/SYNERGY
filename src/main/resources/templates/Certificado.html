<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificado de participación – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/documento.css" th:href="@{/css/documento.css}">
</head>
<body class="doc">
  <nav class="doc-toolbar no-print">
    <a th:href="@{/dashboard}" class="doc-btn"><i class="fa-solid fa-arrow-left"></i> Volver</a>
    <button type="button" class="doc-btn doc-btn-primary" data-print><i class="fa-solid fa-print"></i> Imprimir o guardar como PDF</button>
  </nav>

  <article class="doc-page certificado">
    <img th:src="@{/img/logo.png}" src="../static/img/logo.png" alt="Synergy" class="cert-logo">
    <p class="cert-pre">Synergy certifica que</p>
    <h1 class="cert-nombre" th:text="${usuario.nombre}">Nombre del voluntario</h1>
    <p class="cert-texto">
      participó como voluntario(a) en el proyecto ambiental
      <strong th:text="${proyecto.nombre}">Proyecto</strong>
      (<span th:text="${proyecto.categoria ?: 'proyecto ambiental'}">categoría</span><span th:if="${proyecto.ubicacion != null}" th:text="', ' + ${proyecto.ubicacion}">, barrio</span>, Cartagena de Indias),
      realizado del <span th:text="${proyecto.fechaInicio != null ? #temporals.format(proyecto.fechaInicio, 'dd/MM/yyyy') : '-'}">inicio</span>
      al <span th:text="${proyecto.fechaFin != null ? #temporals.format(proyecto.fechaFin, 'dd/MM/yyyy') : '-'}">fin</span>.
    </p>
    <p class="cert-texto" th:if="${tareasAsignadas > 0 or entregas > 0}"
       th:text="'Tuvo ' + ${tareasAsignadas} + ' tareas asignadas y realizó ' + ${entregas} + ' entregas.'">Tareas y entregas</p>
    <div class="cert-firmas">
      <div><span class="cert-linea"></span><strong th:text="${nombreLider}">Líder</strong><small>Líder del proyecto</small></div>
      <div><span class="cert-linea"></span><strong>Synergy</strong><small th:text="'Emitido el ' + ${#temporals.format(emitido, 'dd/MM/yyyy')}">Emitido</small></div>
    </div>
    <p class="cert-codigo" th:text="'Código: ' + ${codigoVerificacion}">Código</p>
  </article>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
