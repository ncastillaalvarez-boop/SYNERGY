<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos Disponibles – Synergy</title>
  <link rel="stylesheet" href="/css/Lista_Proyectos.css">
</head>
<body>

  <div class="hero">
    <div class="overlay"></div>

    <div class="container">
      <div class="card">

        <!-- ENCABEZADO -->
        <div class="header">
          <h1>Proyectos Disponibles</h1>
          <p class="subtitle">Explora los proyectos publicados y únete al que más te interese.</p>
        </div>

        <!-- BUSCADOR -->
        <div class="buscador-wrapper" style="margin-bottom: 24px;">
          <input type="text" id="buscador" onkeyup="buscarProyectos()"
                 placeholder="🔍 Buscar por nombre o descripción..."
                 class="buscador-input">
        </div>

        <!-- SIN PROYECTOS -->
        <div th:if="${#lists.isEmpty(proyectos)}" class="empty-invitado">
          No hay proyectos disponibles en este momento.
        </div>

        <!-- GRILLA DE TARJETAS -->
        <div class="proyectos-grid" id="gridProyectos">

          <div th:each="p : ${proyectos}" class="proy-card">

            <!-- Encabezado de tarjeta -->
            <div class="proy-card-top">
              <h3 class="proy-nombre" th:text="${p.nombre}">Nombre</h3>
              <span class="proy-fecha"
                    th:text="${p.fechaInicio != null ? '📅 ' + p.fechaInicio : ''}">
              </span>
            </div>

            <!-- Descripción -->
            <p class="proy-desc" th:text="${p.descripcion}">Descripción del proyecto.</p>

            <!-- Botón al fondo -->
            <div class="proy-footer">

              <!-- Usuario autenticado: formulario de inscripción -->
              <form th:if="${usuario != null and usuario.getId() != null}"
                    th:action="@{'/proyectos/participacion/inscribir/' + ${p.id} + '/' + ${usuario.id}}"
                    method="post" style="width: 100%;">
                <button type="submit" class="btn-participar">Participar</button>
              </form>

              <!-- Invitado: redirige a seleccionar rol -->
              <button th:if="${usuario == null or usuario.getId() == null}"
                      class="btn-participar"
                      onclick="window.location.href='/seleccionar-rol'">
                Participar
              </button>

            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script>
    function buscarProyectos() {
      const filter = document.getElementById("buscador").value.toLowerCase();
      document.querySelectorAll(".proy-card").forEach(card => {
        const nombre = card.querySelector(".proy-nombre").textContent.toLowerCase();
        const desc   = card.querySelector(".proy-desc").textContent.toLowerCase();
        card.style.display = (nombre.includes(filter) || desc.includes(filter)) ? "" : "none";
      });
    }
  </script>

</body>
</html>
