<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos Disponibles – Synergy</title>
  <link rel="stylesheet" href="/css/Lista_Proyectos.css">
</head>
<body>

  <div class="hero">
    <div class="overlay"></div>

    <div class="container">
      <div class="card">

        <!-- ENCABEZADO -->
        <div class="header">
          <button class="btn-inicio" onclick="location.href='/'">🏠 Volver al inicio</button>
          <h1>Proyectos Disponibles</h1>
          <p class="subtitle">Participa en cualquiera de los proyectos publicados.</p>
        </div>

        <!-- BUSCADOR -->
        <div class="search-container" style="margin-bottom: 20px; display: flex; justify-content: flex-end;">
            <input type="text" id="buscador" onkeyup="buscarProyectos()" placeholder="🔍 Buscar por nombre o descripción..." style="padding: 10px; width: 100%; max-width: 400px; border-radius: 8px; border: 1px solid #ccc;">
        </div>

        <!-- TABLA -->
        <table class="project-table" id="tablaProyectos">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Fecha Inicio</th>
              <th>Acción</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="p : ${proyectos}">
              <td th:text="${pStat.index + 1}"></td>
              <td th:text="${p.nombre}"></td>
              <td th:text="${p.descripcion}"></td>

              <!-- Fecha -->
              <td th:text="${p.fechaInicio}"></td>

              <td>
                <div class="acciones">

                  <!-- SI HAY USUARIO LOGUEADO PUEDE PARTICIPAR -->
                  <form th:if="${usuario != null and usuario.getId() != null}"
                        th:action="@{'/proyectos/participacion/inscribir/' + ${p.id} + '/' + ${usuario.id}}" 
                        method="post">
                    <button type="submit" class="btn-participar">Participar</button>
                  </form>

                  <!--SI ES INVITADO LO REDIRIGE A LOGIN-->
                   <button th:if="${usuario == null or usuario.getId() == null}" 
                      class="btn-participar"
                      onclick="window.location.href='/login'">
                      Participar
                   </button>

                </div>
              </td>

            </tr>
          </tbody>

        </table>
      </div>
    </div>
  </div>

  <script>
    function buscarProyectos() {
        let input = document.getElementById("buscador");
        let filter = input.value.toLowerCase();
        let table = document.getElementById("tablaProyectos");
        let tr = table.getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
            let tdNombre = tr[i].getElementsByTagName("td")[1];
            let tdDesc = tr[i].getElementsByTagName("td")[2];
            if (tdNombre || tdDesc) {
                let txtValue = (tdNombre.textContent || tdNombre.innerText) + " " + (tdDesc.textContent || tdDesc.innerText);
                if (txtValue.toLowerCase().indexOf(filter) > -1) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }       
        }
    }
    function showToast(message, type) {
        const toast = document.getElementById("toast");
        toast.textContent = message;

        toast.className = "toast " + type; // success / error

        setTimeout(() => {
            toast.classList.add("hidden");
        }, 2800); // Duración en pantalla
    }
</script>


</body>
</html>
