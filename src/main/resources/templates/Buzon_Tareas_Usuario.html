<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Mis tareas – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('tareas')}"></div>
  <div class="app-main">
  <div th:replace="~{fragments/sidebar :: topbar}"></div>

  <main class="app-container">
    <section class="app-card">
      <header class="page-header">
        <div class="page-heading">
          <span class="page-icon has-img"><img src="../static/img/icons/tareas.png" th:src="@{/img/icons/tareas.png}" alt=""></span>
          <div>
            <h1 class="page-title">Mis tareas</h1>
            <p class="page-subtitle">Las tareas que te asignaron los líderes de tus proyectos.</p>
          </div>
        </div>
      </header>

      <div th:if="${mensaje}" class="alert alert-success" data-autohide>
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${mensaje}"></span>
      </div>
      <div th:if="${error}" class="alert alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}"></span>
      </div>

      <div th:if="${#lists.isEmpty(tareas)}" class="empty-state">
        <div class="empty-state-icon has-img"><img src="../static/img/icons/logro.png" th:src="@{/img/icons/logro.png}" alt="" class=""></div>
        <h3>Todo al día</h3>
        <p>No tienes tareas asignadas actualmente.</p>
      </div>

      <div class="list">
        <div th:each="t, st : ${tareas}" class="list-row" th:style="'--i:' + ${st.index}">
          <div class="list-row-main">
            <span class="item-card-icon"><i class="fa-solid fa-clipboard-check"></i></span>
            <div class="list-row-body">
              <div class="list-row-title" th:text="${t.titulo}">Título</div>
              <div class="list-row-desc" th:text="${t.descripcion}">Descripción</div>
              <div class="meta">
                <span><i class="fa-regular fa-clock"></i> Entrega: <strong th:text="${t.fechaEntrega != null ? #temporals.format(t.fechaEntrega, 'dd/MM/yyyy') : '-'}">-</strong></span>
                <span class="badge" th:classappend="${#strings.toUpperCase(t.estado) == 'COMPLETADA'} ? 'badge-success' : (${#strings.toUpperCase(t.estado) == 'EN_PROGRESO'} ? 'badge-info' : (${#strings.toUpperCase(t.estado) == 'CANCELADA'} ? 'badge-danger' : 'badge-warning'))" th:text="${t.estado}">PENDIENTE</span>
                <span th:if="${entregadas != null and #sets.contains(entregadas, t.id)}" class="badge badge-info no-dot"><i class="fa-solid fa-paperclip"></i> Evidencia enviada</span>
              </div>
            </div>
          </div>
          <a th:href="@{/tareas/entregar/{id}(id=${t.id})}" class="btn"
             th:classappend="${#strings.toUpperCase(t.estado) == 'COMPLETADA'} ? 'btn-secondary' : 'btn-primary'">
            <i class="fa-solid fa-paper-plane"></i>
            <span th:text="${#strings.toUpperCase(t.estado) == 'COMPLETADA'} ? 'Enviar otra evidencia' : 'Entregar tarea'">Entregar tarea</span>
          </a>
        </div>
      </div>

    </section>
  </main>
  </div>
</div>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
