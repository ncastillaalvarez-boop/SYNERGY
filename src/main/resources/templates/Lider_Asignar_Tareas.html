<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Proyectos y tareas – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('lider-proyectos')}"></div>
  <div class="app-main">
  <div th:replace="~{fragments/sidebar :: topbar}"></div>

  <main class="app-container">
    <section class="app-card">
      <header class="page-header">
        <nav class="page-toolbar">
          <div class="toolbar-group">
            
            <a th:href="@{/lider/proyecto/nuevo}" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Nuevo proyecto</a>
          </div>
        </nav>
        <div class="page-heading">
          <span class="page-icon has-img"><img src="../static/img/icons/tareas.png" th:src="@{/img/icons/tareas.png}" alt=""></span>
          <div>
            <h1 class="page-title">Proyectos y tareas</h1>
            <p class="page-subtitle">Abre un proyecto para ver su detalle o asigna nuevas tareas.</p>
          </div>
        </div>
      </header>

      <div th:if="${mensaje}" class="alert alert-success" data-autohide>
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${mensaje}"></span>
      </div>
      <div th:if="${error}" class="alert alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}"></span>
      </div>

      <div th:if="${#lists.isEmpty(proyectos)}" class="empty-state">
        <div class="empty-state-icon has-img"><img src="../static/img/icons/proyectos.png" th:src="@{/img/icons/proyectos.png}" alt="" class=""></div>
        <h3>Sin proyectos</h3>
        <p>No tienes proyectos creados aún.</p>
        <a th:href="@{/lider/proyecto/nuevo}" class="btn btn-primary mt-2"><i class="fa-solid fa-plus"></i> Crear proyecto</a>
      </div>

      <div th:if="${!#lists.isEmpty(proyectos)}" class="table-wrap">
        <table class="table">
          <thead>
            <tr><th>Proyecto</th><th>Integrantes</th><th>Estado</th><th>Acciones</th></tr>
          </thead>
          <tbody>
            <tr th:each="p : ${proyectos}">
              <td>
                <a th:href="@{/lider/proyecto/{id}/detalle(id=${p.id})}" class="link">
                  <i class="fa-solid fa-diagram-project"></i> <span th:text="${p.nombre}">Proyecto</span>
                </a>
              </td>
              <td>
                <div class="avatar-stack">
                  <div th:if="${#lists.size(p.participantes) <= 1}" class="avatar avatar-sm is-empty" title="Sin voluntarios">–</div>
                  <th:block th:each="uid : ${p.participantes}">
                    <div th:if="${uid != p.idLider and iniciales[uid] != null}" class="avatar avatar-sm"
                         th:title="${nombres[uid]}" th:text="${iniciales[uid]}">AB</div>
                  </th:block>
                </div>
              </td>
              <td><span class="badge" th:classappend="${p.estado == 'ACTIVO'} ? 'badge-success is-live' : (${p.estado == 'PENDIENTE'} ? 'badge-warning' : (${p.estado == 'COMPLETADO'} ? 'badge-info' : 'badge-danger'))" th:text="${p.estado}">ACTIVO</span></td>
              <td>
                <div class="table-actions">
                  <a th:href="@{/tareas/asignar/{id}(id=${p.id})}" class="btn btn-primary btn-sm"><i class="fa-solid fa-list-check"></i> Tareas</a>
                  <form th:if="${p.estado != 'COMPLETADO'}" th:action="@{/lider/proyecto/{id}/completar(id=${p.id})}" method="post" class="inline-form">
                    <button type="submit" class="btn btn-success btn-sm" data-confirm="¿Marcar este proyecto como completado?" data-confirm-ok="Completar">
                      <i class="fa-solid fa-flag-checkered"></i> Completar
                    </button>
                  </form>
                  <form th:action="@{/lider/proyecto/{id}/eliminar(id=${p.id})}" method="post" class="inline-form">
                    <button type="submit" class="btn btn-danger btn-sm" data-confirm="¿Eliminar este proyecto?" data-confirm-ok="Eliminar">
                      <i class="fa-regular fa-trash-can"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </section>
  </main>
  </div>
</div>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
