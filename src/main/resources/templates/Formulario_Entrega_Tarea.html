<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Entregar Tarea – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

  <div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('tareas')}"></div>
  <div class="app-main">
  <div th:replace="~{fragments/sidebar :: topbar}"></div>

  <main class="app-container is-narrow">
    <section class="app-card">

      <!-- ENCABEZADO -->
      <header class="page-header">
        <nav class="page-toolbar">
          <div class="toolbar-group">
            <a th:href="@{/tareas/buzon}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver</a>
          </div>
          <a th:href="@{/}" class="mini-brand"><span class="mini-brand-mark"><img src="../static/img/logo-mark.png" th:src="@{/img/logo-mark.png}" alt=""></span><span>Synergy</span></a>
        </nav>
        <div class="page-heading">
          <span class="page-icon has-img"><img src="../static/img/icons/reporte-fotografico.png" th:src="@{/img/icons/reporte-fotografico.png}" alt="" loading="lazy"></span>
          <div>
            <h1 class="page-title">Entregar tarea</h1>
            <p class="page-subtitle">Sube el archivo correspondiente a tu tarea asignada.</p>
          </div>
        </div>
      </header>

      <!-- INFORMACIÓN DE LA TAREA -->
      <div class="detail-panel">
        <h2 class="detail-panel-title" th:text="${tarea.titulo}">Título tarea</h2>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-align-left"></i> Descripción</span>
          <span class="detail-value" th:text="${tarea.descripcion}"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-regular fa-clock"></i> Fecha límite</span>
          <span class="detail-value" th:text="${tarea.fechaEntrega}"></span>
        </div>
      </div>

      <!-- ERROR -->
      <div th:if="${error}" class="alert alert-error" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}"></span>
      </div>

      <!-- FORMULARIO -->
      <form th:action="@{/tareas/entregar/{id}(id=${tarea.id})}"
            method="post"
            enctype="multipart/form-data"
            class="stack" data-loading>

        <label class="file-drop" for="archivo">
          <input type="file" id="archivo" name="archivo" required>
          <span class="file-drop-icon"><i class="fa-solid fa-cloud-arrow-up"></i></span>
          <span class="file-drop-title">Selecciona un archivo o arrástralo aquí</span>
          <span class="file-drop-name">PDF, imágenes, documentos…</span>
        </label>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-lg">
            <i class="fa-solid fa-paper-plane"></i> Enviar Tarea
          </button>
          <a th:href="@{/tareas/buzon}" class="btn btn-secondary btn-lg">Cancelar</a>
        </div>
      </form>

    </section>
  </main>
  </div>
</div>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
