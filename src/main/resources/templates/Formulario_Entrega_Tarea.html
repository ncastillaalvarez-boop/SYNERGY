<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregar Tarea – Synergy</title>
    <link rel="stylesheet" href="/css/Usuarios_Dashboard.css">
</head>

<body>

<div class="hero">
    <div class="overlay"></div>

    <div class="container">
        <div class="card">

            <!-- ENCABEZADO -->
            <div class="header">
                <a th:href="@{/tareas/buzon}" class="btn-inicio">⬅ Volver</a>

                <h1>Entregar tarea</h1>
                <p class="subtitle">Sube el archivo correspondiente a tu tarea asignada.</p>
            </div>

            <!-- INFORMACIÓN DE LA TAREA -->
            <div class="task-info">
                <h2 th:text="${tarea.titulo}">Título tarea</h2>

                <p><strong>Descripción:</strong>
                    <span th:text="${tarea.descripcion}"></span>
                </p>

                <p><strong>Fecha límite:</strong>
                    <span th:text="${tarea.fechaEntrega}"></span>
                </p>
            </div>

            <!-- ERROR -->
            <p th:if="${error}" style="color: #ff8080; font-weight: bold; margin: 10px 0;">
                ❌ <span th:text="${error}"></span>
            </p>

            <!-- FORMULARIO -->
            <form th:action="@{/tareas/entregar/{id}(id=${tarea.id})}"
                  method="post"
                  enctype="multipart/form-data"
                  style="display:flex; flex-direction:column; gap:15px; margin-top:20px;">

                <div class="input-group">
                    <label style="font-size:16px;">
                        📸 Sube la evidencia fotográfica de tu tarea:
                    </label>
                    <input type="file" name="archivo" id="archivo-imagen" accept="image/*" required
                           style="background: rgba(15, 23, 42, 0.6); color: white; padding:12px; border-radius:8px; border: 1px solid rgba(255,255,255,0.1);"
                           onchange="mostrarVistaPrevia(event)">
                </div>

                <!-- Contenedor para la previsualización de la imagen -->
                <div id="vista-previa-container" style="display: none; margin-top: 15px; text-align: center;">
                    <p style="font-size:14px; color:#94A3B8; margin-bottom: 5px;">Vista previa de la evidencia:</p>
                    <img id="imagen-previa" src="" alt="Vista previa" style="max-width: 100%; max-height: 300px; border-radius: 12px; border: 2px solid rgba(16, 185, 129, 0.3);">
                </div>

                <div style="display:flex; justify-content:center; margin-top:10px;">
                    <button type="submit" class="btn-aceptar" style="font-size:16px; padding: 12px 24px; width: 100%;">
                        📤 Enviar Evidencia y Completar Tarea
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script>
    function mostrarVistaPrevia(event) {
        const input = event.target;
        const file = input.files[0];
        const container = document.getElementById('vista-previa-container');
        const img = document.getElementById('imagen-previa');

        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                img.src = e.target.result;
                container.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            container.style.display = 'none';
            img.src = "";
        }
    }
</script>

</div>

</body>
</html>
