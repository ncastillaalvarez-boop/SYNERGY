<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>404 - Página no encontrada – Synergy</title>
  <link rel="icon" type="image/png" href="../../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../../static/css/error.css" th:href="@{/css/error.css}">
  <style>.theme-icon-light{display:none}[data-theme="light"] .theme-icon-dark{display:none}[data-theme="light"] .theme-icon-light{display:inline-block}</style>
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <button type="button" class="btn btn-secondary btn-icon theme-float" style="position:fixed;top:22px;right:22px;z-index:50" data-theme-toggle aria-label="Cambiar tema claro u oscuro">
    <i class="fa-solid fa-moon theme-icon-dark"></i>
    <i class="fa-solid fa-sun theme-icon-light"></i>
  </button>

  <main class="error-page">
    <div class="error-card">
      <div class="error-icon"><i class="fa-solid fa-map-location-dot"></i></div>
      <div class="error-code">404</div>
      <h1>Página no encontrada</h1>
      <p class="subtitle">Lo sentimos, la página que estás buscando no existe o ha sido movida. Verifica la URL e inténtalo de nuevo.</p>
      <div class="error-actions">
        <a th:href="@{/}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Volver al Inicio</a>
        <button type="button" onclick="history.back()" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Página anterior</button>
      </div>
    </div>
  </main>
  <script src="../../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
