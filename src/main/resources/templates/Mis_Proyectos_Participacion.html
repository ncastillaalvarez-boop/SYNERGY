<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Mis Proyectos – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

  <main class="app-container">
    <section class="app-card">

      <header class="page-header">
        <nav class="page-toolbar">
          <div class="toolbar-group">
            <a th:href="@{/inicio}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver al Menú Principal</a>
          </div>
          <a th:href="@{/}" class="mini-brand"><span class="mini-brand-mark"><img src="../static/img/logo-mark.png" th:src="@{/img/logo-mark.png}" alt=""></span><span>Synergy</span></a>
        </nav>
        <div class="page-heading">
          <span class="page-icon has-img"><img src="../static/img/icons/proyectos.png" th:src="@{/img/icons/proyectos.png}" alt="" loading="lazy"></span>
          <div>
            <h1 class="page-title">Mis Proyectos</h1>
            <p class="page-subtitle">Proyectos donde participas activamente</p>
          </div>
        </div>
      </header>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Inicio</th>
              <th>Fin</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody>
            <!-- Lista de proyectos del usuario -->
            <tr th:each="proyecto : ${misProyectos}">
              <td class="cell-strong" th:text="${proyecto.nombre}"></td>
              <td class="cell-muted" th:text="${proyecto.descripcion}"></td>
              <td th:text="${proyecto.fechaInicio}"></td>
              <td th:text="${proyecto.fechaFin}"></td>
              <td>
                <a th:href="@{'/buzon/' + ${proyecto.id}}" class="btn btn-success btn-sm"><i class="fa-solid fa-envelope-open-text"></i> Abrir Buzón</a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(misProyectos)}">
              <td colspan="5" class="cell-empty"><i class="fa-regular fa-folder-open"></i>Aún no participas en ningún proyecto.</td>
            </tr>
          </tbody>
        </table>
      </div>

    </section>
  </main>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
