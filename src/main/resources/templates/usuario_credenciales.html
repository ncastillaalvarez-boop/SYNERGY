<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Credenciales – Synergy</title>
  <link rel="stylesheet" href="/css/Usuarios_Dashboard.css">
</head>
<body>

  <div class="hero">
    <div class="overlay"></div>

    <div class="container">
      <div class="card">

        <!-- ENCABEZADO -->
        <div class="header">
          <div class="top-buttons">
            <a th:href="@{/dashboard}" class="btn-inicio">← Volver al panel</a>
          </div>
          <h1>🔐 Mis Credenciales</h1>
          <p class="subtitle">Gestiona tu información personal y seguridad.</p>
        </div>

        <!-- MENSAJES -->
        <div th:if="${mensaje}"
             style="background:#d4edda; border:1px solid #c3e6cb; border-radius:10px;
                    padding:12px 18px; margin-bottom:20px; color:#155724; font-size:14px; font-weight:600;">
          <span th:text="${mensaje}"></span>
        </div>
        <div th:if="${error}"
             style="background:#f8d7da; border:1px solid #f5c6cb; border-radius:10px;
                    padding:12px 18px; margin-bottom:20px; color:#721c24; font-size:14px; font-weight:600;">
          <span th:text="${error}"></span>
        </div>

        <!-- FORMULARIO -->
        <form th:action="@{/usuario/actualizar-credenciales}" method="post">

          <!-- SECCIÓN 1: INFORMACIÓN BÁSICA -->
          <div style="margin-bottom:28px; padding-bottom:24px; border-bottom:2px solid #f0f0f0;">
            <p style="font-size:16px; font-weight:700; color:#1a1a2e; margin-bottom:16px;">
              👤 Información Básica
            </p>

            <div style="margin-bottom:16px;">
              <label style="display:block; margin-bottom:6px; color:#555; font-weight:600; font-size:14px;">
                Nombre Completo
              </label>
              <input type="text" name="nombre" th:value="${usuario.nombre}"
                     placeholder="Tu nombre completo"
                     style="width:100%; padding:11px 14px; border:2px solid #e0e0e0;
                            border-radius:10px; font-size:15px; transition:border-color 0.2s;
                            box-sizing:border-box;"
                     onfocus="this.style.borderColor='#0F6E56'"
                     onblur="this.style.borderColor='#e0e0e0'">
            </div>

            <div style="margin-bottom:16px;">
              <label style="display:block; margin-bottom:6px; color:#555; font-weight:600; font-size:14px;">
                Correo Electrónico
              </label>
              <input type="email" name="correo" th:value="${usuario.correo}"
                     placeholder="tu@email.com"
                     style="width:100%; padding:11px 14px; border:2px solid #e0e0e0;
                            border-radius:10px; font-size:15px; transition:border-color 0.2s;
                            box-sizing:border-box;"
                     onfocus="this.style.borderColor='#0F6E56'"
                     onblur="this.style.borderColor='#e0e0e0'">
            </div>

            <div>
              <label style="display:block; margin-bottom:6px; color:#555; font-weight:600; font-size:14px;">
                Rol Actual
              </label>
              <input type="text" th:value="${usuario.rol}" readonly
                     style="width:100%; padding:11px 14px; border:2px solid #e0e0e0;
                            border-radius:10px; font-size:15px; background:#f5f5f5;
                            color:#888; cursor:not-allowed; box-sizing:border-box;">
              <span th:text="${usuario.rol}"
                    style="display:inline-block; margin-top:6px; background:#e8f5f1;
                           color:#0F6E56; border-radius:12px; padding:3px 12px;
                           font-size:12px; font-weight:700;">
              </span>
            </div>
          </div>

          <!-- SECCIÓN 2: CAMBIAR CONTRASEÑA -->
          <div style="margin-bottom:28px;">
            <p style="font-size:16px; font-weight:700; color:#1a1a2e; margin-bottom:16px;">
              🔒 Cambiar Contraseña
            </p>

            <div style="margin-bottom:16px;">
              <label style="display:block; margin-bottom:6px; color:#555; font-weight:600; font-size:14px;">
                Contraseña Actual
              </label>
              <input type="password" name="contrasenaActual"
                     placeholder="Tu contraseña actual"
                     style="width:100%; padding:11px 14px; border:2px solid #e0e0e0;
                            border-radius:10px; font-size:15px; transition:border-color 0.2s;
                            box-sizing:border-box;"
                     onfocus="this.style.borderColor='#0F6E56'"
                     onblur="this.style.borderColor='#e0e0e0'">
            </div>

            <div style="margin-bottom:16px;">
              <label style="display:block; margin-bottom:6px; color:#555; font-weight:600; font-size:14px;">
                Nueva Contraseña
              </label>
              <input type="password" name="contrasenaNueva"
                     placeholder="Nueva contraseña"
                     style="width:100%; padding:11px 14px; border:2px solid #e0e0e0;
                            border-radius:10px; font-size:15px; transition:border-color 0.2s;
                            box-sizing:border-box;"
                     onfocus="this.style.borderColor='#0F6E56'"
                     onblur="this.style.borderColor='#e0e0e0'">
            </div>

            <div style="margin-bottom:16px;">
              <label style="display:block; margin-bottom:6px; color:#555; font-weight:600; font-size:14px;">
                Confirmar Nueva Contraseña
              </label>
              <input type="password" name="contrasenaConfirmacion"
                     placeholder="Repite la nueva contraseña"
                     style="width:100%; padding:11px 14px; border:2px solid #e0e0e0;
                            border-radius:10px; font-size:15px; transition:border-color 0.2s;
                            box-sizing:border-box;"
                     onfocus="this.style.borderColor='#0F6E56'"
                     onblur="this.style.borderColor='#e0e0e0'">
            </div>

            <div style="background:#f0f9f6; border-left:4px solid #0F6E56; padding:12px 16px;
                        border-radius:6px; font-size:13px; color:#0F6E56;">
              <strong>Requisitos:</strong>
              <ul style="margin:6px 0 0 18px;">
                <li>Mínimo 6 caracteres</li>
                <li>Dejar vacío si no deseas cambiarla</li>
                <li>Ambas contraseñas deben coincidir</li>
              </ul>
            </div>
          </div>

          <!-- BOTÓN GUARDAR -->
          <button type="submit"
                  style="width:100%; padding:14px; background:#0F6E56; color:white;
                         border:none; border-radius:12px; font-size:16px; font-weight:700;
                         cursor:pointer; transition:background 0.2s;"
                  onmouseover="this.style.background='#0a5240'"
                  onmouseout="this.style.background='#0F6E56'">
            💾 Guardar Cambios
          </button>

        </form>

      </div>
    </div>
  </div>

</body>
</html>
