<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem('synergy-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Panel de administración – Synergy</title>
  <link rel="icon" type="image/png" href="../static/img/logo-mark.png" th:href="@{/img/logo-mark.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../static/css/core.css" th:href="@{/css/core.css}">
  <link rel="stylesheet" href="../static/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('admin-proyectos')}"></div>
  <div class="app-main">
  <div th:replace="~{fragments/sidebar :: topbar}"></div>

  <main class="app-container">
    <section class="app-card">
      <header class="page-header">
        <nav class="page-toolbar">
          <div class="toolbar-group">
            
            <a th:href="@{/admin/usuarios}" class="btn btn-info btn-sm"><i class="fa-solid fa-users"></i> Usuarios</a>
          </div>
        </nav>
        <div class="page-heading">
          <span class="page-icon has-img"><img src="../static/img/icons/ajustes.png" th:src="@{/img/icons/ajustes.png}" alt=""></span>
          <div>
            <h1 class="page-title">Panel de administración</h1>
            <p class="page-subtitle">Aprueba, revisa y gestiona los proyectos de la plataforma.</p>
          </div>
        </div>
      </header>

      <div th:if="${mensaje}" class="alert alert-success" data-autohide>
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${mensaje}"></span>
      </div>
      <div th:if="${error}" class="alert alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}"></span>
      </div>

      <div class="stats-grid">
        <div class="stat-card" style="--i:0"><img src="../static/img/icons/proyectos.png" th:src="@{/img/icons/proyectos.png}" alt="" class="stat-icon">
          <span class="stat-value" th:text="${#numbers.formatInteger(totalProyectos, 1, 'POINT')}">0</span><span class="stat-label">Proyectos</span></div>
        <div class="stat-card" style="--i:1"><img src="../static/img/icons/notificaciones.png" th:src="@{/img/icons/notificaciones.png}" alt="" class="stat-icon">
          <span class="stat-value" th:text="${#numbers.formatInteger(pendientes, 1, 'POINT')}">0</span><span class="stat-label"><a th:href="@{/admin/proyectos(estado='PENDIENTE')}" class="link">Por aprobar</a></span></div>
        <div class="stat-card" style="--i:2"><img src="../static/img/icons/reforestacion.png" th:src="@{/img/icons/reforestacion.png}" alt="" class="stat-icon">
          <span class="stat-value" th:text="${#numbers.formatInteger(activos, 1, 'POINT')}">0</span><span class="stat-label">Activos</span></div>
        <div class="stat-card" style="--i:3"><img src="../static/img/icons/comunidad.png" th:src="@{/img/icons/comunidad.png}" alt="" class="stat-icon">
          <span class="stat-value" th:text="${#numbers.formatInteger(totalUsuarios, 1, 'POINT')}">0</span><span class="stat-label">Usuarios</span></div>
      </div>

      <h2 class="section-heading"><i class="fa-solid fa-folder-open"></i> Proyectos
        <span class="count" th:text="${#numbers.formatInteger(paginacion.totalElementos, 1, 'POINT')}">0</span></h2>

      <form class="filter-bar" th:action="@{/admin/proyectos}" method="get" role="search" data-autosubmit>
        <div class="field field-search">
          <label for="q">Buscar</label>
          <div class="search-input">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="q" name="q" th:value="${filtro.q}" maxlength="60" placeholder="Nombre, código o barrio">
          </div>
        </div>
        <div class="field">
          <label for="estado">Estado</label>
          <select id="estado" name="estado">
            <option value="">Todos</option>
            <option th:each="e : ${estadosProyecto}" th:value="${e.key}" th:selected="${filtro.estado == e.key}"
                    th:text="${e.value + ' (' + porEstado[e.key] + ')'}">Estado</option>
          </select>
        </div>
        <div class="field">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="">Todas</option>
            <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}" th:selected="${filtro.categoria == c}">Categoría</option>
          </select>
        </div>
        <div class="field">
          <label for="orden">Ordenar por</label>
          <select id="orden" name="orden">
            <option th:each="o : ${ordenesProyecto}" th:value="${o.key}" th:text="${o.value}" th:selected="${filtro.orden == o.key}">Orden</option>
          </select>
        </div>
        <div class="filter-actions">
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-filter"></i> Filtrar</button>
          <a th:if="${filtro.activo or (filtro.estado != null and !#strings.isEmpty(filtro.estado))}" th:href="@{/admin/proyectos}" class="btn btn-secondary" title="Quitar filtros"><i class="fa-solid fa-xmark"></i></a>
        </div>
      </form>

      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Proyecto</th><th>Líder</th><th>Estado</th><th>Fechas</th><th>Acciones</th></tr></thead>
          <tbody>
            <tr th:each="proyecto : ${proyectos}">
              <td>
                <span class="cell-strong" th:text="${proyecto.nombre}">Nombre</span>
                <span class="cell-sub"><span class="project-code" th:text="${proyecto.codigo}">SYN</span>
                  <th:block th:if="${proyecto.categoria != null}"> · <span th:text="${proyecto.categoria}"></span></th:block>
                  <th:block th:if="${proyecto.ubicacion != null}"> · <span th:text="${proyecto.ubicacion}"></span></th:block></span>
              </td>
              <td th:text="${lideres[proyecto.idLider] ?: 'Sin líder'}">Líder</td>
              <td><span class="badge" th:classappend="${proyecto.estado == 'ACTIVO'} ? 'badge-success is-live' : (${proyecto.estado == 'PENDIENTE'} ? 'badge-warning' : (${proyecto.estado == 'COMPLETADO'} ? 'badge-info' : 'badge-danger'))" th:text="${proyecto.estadoEtiqueta}">Estado</span></td>
              <td><span class="meta" style="margin:0"><span><i class="fa-regular fa-calendar"></i>
                <span th:text="${proyecto.fechaInicio != null ? #temporals.format(proyecto.fechaInicio, 'dd/MM/yy') : '-'}">-</span>
                → <span th:text="${proyecto.fechaFin != null ? #temporals.format(proyecto.fechaFin, 'dd/MM/yy') : '-'}">-</span></span></span></td>
              <td>
                <div class="table-actions">
                  <a th:href="@{/admin/proyecto/{id}(id=${proyecto.id})}" class="btn btn-info btn-sm"><i class="fa-regular fa-eye"></i> Ver</a>
                  <form th:if="${proyecto.estado == 'PENDIENTE'}" th:action="@{/admin/proyecto/{id}/aceptar(id=${proyecto.id})}" method="post" class="inline-form">
                    <input type="hidden" name="volver" th:value="${volverProyectos}">
                    <button type="submit" class="btn btn-success btn-sm"><i class="fa-solid fa-check"></i> Aprobar</button>
                  </form>
                  <form th:if="${proyecto.estado == 'PENDIENTE'}" th:action="@{/admin/proyecto/{id}/rechazar(id=${proyecto.id})}" method="post" class="inline-form">
                    <input type="hidden" name="volver" th:value="${volverProyectos}">
                    <button type="submit" class="btn btn-secondary btn-sm" data-confirm="¿Rechazar esta propuesta? Quedará como cancelada." data-confirm-ok="Rechazar">
                      <i class="fa-solid fa-ban"></i> Rechazar</button>
                  </form>
                  <form th:action="@{/admin/proyecto/{id}/eliminar(id=${proyecto.id})}" method="post" class="inline-form">
                    <input type="hidden" name="volver" th:value="${volverProyectos}">
                    <button type="submit" class="btn btn-danger btn-sm" data-confirm="¿Eliminar este proyecto? También se borrarán sus tareas, entregas y comentarios." data-confirm-ok="Eliminar">
                      <i class="fa-regular fa-trash-can"></i></button>
                  </form>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(proyectos)}">
              <td colspan="5" class="cell-empty"><i class="fa-regular fa-folder-open"></i>
                <span th:text="${filtro.activo} ? 'Ningún proyecto coincide con la búsqueda.' : 'No hay proyectos en este estado.'">No hay proyectos.</span></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:replace="~{fragments/paginacion :: paginacion(${paginacion}, 'proyectos')}"></div>

    </section>
  </main>
  </div>
</div>

  <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
</body>
</html>
