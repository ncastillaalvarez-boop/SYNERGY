<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración – Synergy</title>
  <link rel="stylesheet" href="/css/Administrador_Dashboard.css" />
</head>
<body>

  <div class="hero">
    <div class="overlay"></div>

    <div class="container">
      <div class="card">

        <!-- Encabezado -->
        <div class="header">
          <div class="top-buttons">
            <a th:href="@{/index}" class="btn-inicio">⬅ Volver</a>
            <a th:href="@{/admin/usuarios}" class="btn-usuarios">👥 Ver Usuarios</a>
          </div>
          <h1>Panel de Administración</h1>
          <p class="subtitle">Gestiona los proyectos enviados por los usuarios.</p>
        </div>

        <!-- Mensaje de éxito o error -->
        <div th:if="${mensaje}" class="alert-success" th:text="${mensaje}"></div>

        <!-- Barra de Búsqueda -->
        <div style="margin-bottom: 20px;">
          <input type="text" id="buscadorProyectos" onkeyup="filtrarProyectos()" placeholder="🔍 Buscar por nombre o estado..."
                 style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(15,23,42,0.6); color: white; font-size: 16px;">
        </div>

        <!-- Tabla de proyectos -->
        <table class="project-table">
          <thead>
            <tr>
              <th>Nombre del Proyecto</th>
              <th>Estado</th>
              <th>Fecha Inicio</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="proyecto : ${proyectos}">
              <td th:text="${proyecto.nombre}">Nombre</td>
              <td th:text="${proyecto.estado}">Estado</td>
              <td th:text="${proyecto.fechaInicio}">Fecha</td>
              <td class="actions">

                <!-- Ver -->
                <a th:href="@{/admin/proyecto/{id}(id=${proyecto.id})}" class="btn-ver">Ver</a>

                <!-- Aceptar -->
                <form th:action="@{/admin/proyecto/{id}/aceptar(id=${proyecto.id})}" method="post" style="display:inline">
                  <button type="submit" class="btn-aceptar">Aceptar</button>
                </form>

                <!-- Eliminar -->
                <form th:action="@{/admin/proyecto/{id}/eliminar(id=${proyecto.id})}" method="post" style="display:inline">
                  <button type="submit" class="btn-eliminar"
                    onclick="return confirm('¿Seguro que deseas eliminar este proyecto?')">Eliminar</button>
                </form>

              </td>
            </tr>

            <!-- Si no hay proyectos -->
            <tr th:if="${#lists.isEmpty(proyectos)}">
              <td colspan="4">No hay proyectos registrados.</td>
            </tr>

          </tbody>
        </table>

      </div>
    </div>
  </div>

<script>
function filtrarProyectos() {
  const filter = document.getElementById("buscadorProyectos").value.toLowerCase();
  const trs = document.querySelectorAll(".project-table tbody tr");
  
  trs.forEach(tr => {
    if(tr.children.length === 1) return; // Ignorar el "No hay proyectos"
    const nombre = tr.children[0].textContent.toLowerCase();
    const estado = tr.children[1].textContent.toLowerCase();
    
    if (nombre.includes(filter) || estado.includes(filter)) {
      tr.style.display = "";
    } else {
      tr.style.display = "none";
    }
  });
}
</script>
</body>
</html>
