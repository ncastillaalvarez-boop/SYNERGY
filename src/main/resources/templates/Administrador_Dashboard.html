<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración – Synergy</title>
  <link rel="stylesheet" href="/css/Administrador_Dashboard.css" />
</head>
<body>

  <div class="hero">
    <div class="overlay"></div>

    <div class="container">
      <div class="card">

        <!-- Encabezado -->
        <div class="header">
          <div class="top-buttons">
            <a th:href="@{/index}" class="btn-inicio">⬅ Volver</a>
            <a th:href="@{/admin/usuarios}" class="btn-usuarios">👥 Ver Usuarios</a>
          </div>
          <h1>Panel de Administración</h1>
          <p class="subtitle">Gestiona los proyectos enviados por los usuarios.</p>
        </div>

        <!-- Mensaje de éxito o error -->
        <div th:if="${mensaje}" class="alert-success" th:text="${mensaje}"></div>

        <!-- Sección de proyectos -->
        <div class="seccion-panel">

          <div class="seccion-panel-header">
            <span>📋 Proyectos registrados</span>
            <span class="seccion-count"
                  th:text="${#lists.size(proyectos)} + ' proyecto(s)'">0 proyectos</span>
          </div>

          <div class="seccion-panel-body">

            <!-- Buscador -->
            <div class="buscador-wrapper">
              <input type="text" id="buscadorProyectos" onkeyup="filtrarProyectos()"
                     placeholder="🔍 Buscar por nombre o estado..."
                     class="buscador-input">
            </div>

            <!-- Sin proyectos -->
            <div th:if="${#lists.isEmpty(proyectos)}" class="seccion-empty">
              No hay proyectos registrados.
            </div>

            <!-- Tarjeta por proyecto -->
            <div th:each="proyecto : ${proyectos}" class="proyecto-card" th:id="'card-' + ${proyecto.id}">

              <!-- Header: nombre + badge estado -->
              <div class="proyecto-card-header">
                <h3 class="proyecto-nombre" th:text="${proyecto.nombre}">Nombre</h3>
                <span class="badge-estado"
                      th:classappend="${proyecto.estado == 'ACTIVO'} ? ' badge-activo' :
                                      (${proyecto.estado == 'COMPLETADO'} ? ' badge-completado' : ' badge-otro')"
                      th:text="${proyecto.estado ?: 'SIN ESTADO'}">Estado</span>
              </div>

              <!-- Descripción -->
              <p class="proyecto-desc" th:text="${proyecto.descripcion}">Descripción</p>

              <!-- Meta: fechas -->
              <div class="proyecto-meta">
                <span>📅 Inicio: <strong th:text="${proyecto.fechaInicio ?: '—'}">—</strong></span>
                <span th:if="${proyecto.fechaFin != null}">
                  · Fin: <strong th:text="${proyecto.fechaFin}">—</strong>
                </span>
              </div>

              <!-- Participantes -->
              <div class="proyecto-participantes">
                <span class="part-label">
                  👥 Participantes (<span th:text="${#lists.size(participantesPorProyecto[proyecto.id])}">0</span>):
                </span>
                <div th:if="${#lists.isEmpty(participantesPorProyecto[proyecto.id])}" class="part-empty">
                  Sin participantes inscritos
                </div>
                <div class="part-tags" th:unless="${#lists.isEmpty(participantesPorProyecto[proyecto.id])}">
                  <span class="part-tag"
                        th:each="u : ${participantesPorProyecto[proyecto.id]}"
                        th:text="${u.nombre}">Usuario</span>
                </div>
              </div>

              <!-- Acciones -->
              <div class="proyecto-acciones">
                <a th:href="@{/admin/proyecto/{id}(id=${proyecto.id})}" class="btn-ver">👁 Ver detalle</a>

                <form th:action="@{/admin/proyecto/{id}/aceptar(id=${proyecto.id})}" method="post"
                      style="display:inline;">
                  <button type="submit" class="btn-aceptar">✅ Aceptar</button>
                </form>

                <form th:action="@{/admin/proyecto/{id}/eliminar(id=${proyecto.id})}" method="post"
                      style="display:inline;">
                  <button type="submit" class="btn-eliminar"
                    onclick="return confirm('¿Seguro que deseas eliminar este proyecto?')">
                    🗑 Eliminar
                  </button>
                </form>
              </div>

            </div>
            <!-- fin th:each -->

          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    function filtrarProyectos() {
      const filter = document.getElementById("buscadorProyectos").value.toLowerCase();
      document.querySelectorAll(".proyecto-card").forEach(card => {
        const nombre = card.querySelector(".proyecto-nombre").textContent.toLowerCase();
        const badge  = card.querySelector(".badge-estado").textContent.toLowerCase();
        card.style.display = (nombre.includes(filter) || badge.includes(filter)) ? "" : "none";
      });
    }
  </script>

</body>
</html>
